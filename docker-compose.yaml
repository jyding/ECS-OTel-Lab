# Local application smoke test. Compose does not implement ECS awsfirelens.
services:
  pinger:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: pokemon-pinger:lab
    environment:
      INTERVAL_SEC: "15"
      SERVICE_NAME: pokemon-pinger
      COMPONENT: worker
      DEPLOYMENT_ENVIRONMENT: sandbox
      APP_VERSION: "1.0.0"
      OTEL_SERVICE_NAME: pokemon-pinger
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOGS_EXPORTER: none

  catcher:
    build:
      context: .
      dockerfile: app2/Dockerfile
    image: pokemon-catcher:lab
    environment:
      INTERVAL_SEC: "10"
      SERVICE_NAME: pokemon-catcher
      COMPONENT: api
      DEPLOYMENT_ENVIRONMENT: sandbox
      APP_VERSION: "1.0.0"
      OTEL_SERVICE_NAME: pokemon-catcher
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_LOGS_EXPORTER: none
    ports:
      - "127.0.0.1:8080:8080"

  otel-collector:
    profiles: [otel]
    build:
      context: ./collector
    image: otel-with-config:lab
    environment:
      SUMO_METRICS_ENDPOINT: ${SUMO_METRICS_ENDPOINT:-https://example.invalid/v1/metrics}
      SUMO_TRACES_ENDPOINT: ${SUMO_TRACES_ENDPOINT:-https://example.invalid/v1/traces}
